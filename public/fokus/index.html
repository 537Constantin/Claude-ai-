<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fokus — Pomodoro Timer</title>
  <meta name="description" content="Ein kleiner, ablenkungsfreier Pomodoro-Timer für konzentriertes Arbeiten." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍅</text></svg>" />
  <style>
    :root {
      --bg: #0f1226;
      --bg-soft: #171a35;
      --accent: #ff6b6b;
      --accent-2: #4ecdc4;
      --text: #f4f6ff;
      --muted: #9aa0c7;
      --ring-track: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 15% -10%, rgba(78, 205, 196, 0.18), transparent 60%),
        radial-gradient(900px 500px at 90% 110%, rgba(255, 107, 107, 0.18), transparent 60%),
        var(--bg);
      padding: 24px;
      transition: background 0.6s ease;
    }

    body.break {
      --accent: #4ecdc4;
      --accent-2: #ffd166;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(180deg, var(--bg-soft), rgba(23, 26, 53, 0.7));
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 28px;
      padding: 36px 32px 28px;
      box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      text-align: center;
    }

    .mode-tabs {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 999px;
      margin-bottom: 28px;
    }

    .mode-tabs button {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-tabs button.active {
      background: var(--accent);
      color: #fff;
    }

    .ring-wrap {
      position: relative;
      width: 240px;
      height: 240px;
      margin: 0 auto 28px;
    }

    svg { transform: rotate(-90deg); }

    .ring-track { stroke: var(--ring-track); }

    .ring-progress {
      stroke: var(--accent);
      stroke-linecap: round;
      transition: stroke-dashoffset 0.4s linear, stroke 0.6s ease;
      filter: drop-shadow(0 0 8px rgba(255, 107, 107, 0.35));
    }

    .time {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .time .digits {
      font-size: 56px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.01em;
    }

    .time .label {
      margin-top: 4px;
      font-size: 13px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
    }

    .btn {
      border: none;
      cursor: pointer;
      font-weight: 700;
      font-size: 16px;
      border-radius: 16px;
      transition: transform 0.12s ease, opacity 0.2s ease, background 0.2s ease;
    }

    .btn:active { transform: scale(0.96); }

    .btn-primary {
      flex: 1;
      max-width: 200px;
      padding: 16px 24px;
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover { opacity: 0.92; }

    .btn-ghost {
      width: 54px;
      height: 54px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      font-size: 20px;
    }

    .btn-ghost:hover { background: rgba(255, 255, 255, 0.12); }

    .footer {
      margin-top: 24px;
      font-size: 13px;
      color: var(--muted);
    }

    .footer strong { color: var(--accent-2); }
  </style>
</head>
<body>
  <main class="card">
    <div class="mode-tabs" role="tablist">
      <button data-mode="focus" class="active">Fokus</button>
      <button data-mode="short">Kurze Pause</button>
      <button data-mode="long">Lange Pause</button>
    </div>

    <div class="ring-wrap">
      <svg width="240" height="240" viewBox="0 0 240 240">
        <circle class="ring-track" cx="120" cy="120" r="108" fill="none" stroke-width="14" />
        <circle class="ring-progress" id="ring" cx="120" cy="120" r="108" fill="none" stroke-width="14" />
      </svg>
      <div class="time">
        <div class="digits" id="digits">25:00</div>
        <div class="label" id="status">Bereit</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-ghost" id="reset" title="Zurücksetzen">↻</button>
      <button class="btn btn-primary" id="toggle">Start</button>
    </div>

    <p class="footer">Abgeschlossene Runden: <strong id="rounds">0</strong></p>
  </main>

  <script>
    const DURATIONS = { focus: 25 * 60, short: 5 * 60, long: 15 * 60 };
    const LABELS = { focus: "Konzentriert", short: "Kurze Pause", long: "Lange Pause" };

    const ring = document.getElementById("ring");
    const digits = document.getElementById("digits");
    const status = document.getElementById("status");
    const toggleBtn = document.getElementById("toggle");
    const resetBtn = document.getElementById("reset");
    const roundsEl = document.getElementById("rounds");
    const tabs = document.querySelectorAll(".mode-tabs button");

    const R = 108;
    const CIRC = 2 * Math.PI * R;
    ring.style.strokeDasharray = CIRC;
    ring.style.strokeDashoffset = 0;

    let mode = "focus";
    let total = DURATIONS[mode];
    let remaining = total;
    let timer = null;
    let running = false;
    let rounds = 0;

    function format(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      return `${m}:${s}`;
    }

    function render() {
      digits.textContent = format(remaining);
      const progress = 1 - remaining / total;
      ring.style.strokeDashoffset = CIRC * progress;
      document.title = `${format(remaining)} — ${LABELS[mode]}`;
    }

    function setMode(next) {
      mode = next;
      total = DURATIONS[mode];
      remaining = total;
      stop();
      tabs.forEach((t) => t.classList.toggle("active", t.dataset.mode === mode));
      document.body.classList.toggle("break", mode !== "focus");
      status.textContent = "Bereit";
      render();
    }

    function tick() {
      remaining = Math.max(0, remaining - 1);
      render();
      if (remaining === 0) finish();
    }

    function start() {
      if (running) return;
      running = true;
      toggleBtn.textContent = "Pause";
      status.textContent = LABELS[mode];
      timer = setInterval(tick, 1000);
    }

    function stop() {
      running = false;
      toggleBtn.textContent = "Start";
      clearInterval(timer);
    }

    function finish() {
      stop();
      status.textContent = "Fertig! 🎉";
      beep();
      if (mode === "focus") {
        rounds += 1;
        roundsEl.textContent = rounds;
        setMode(rounds % 4 === 0 ? "long" : "short");
      } else {
        setMode("focus");
      }
    }

    function beep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = "sine";
        osc.frequency.value = 660;
        gain.gain.setValueAtTime(0.001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
        osc.start();
        osc.stop(ctx.currentTime + 0.6);
      } catch (e) { /* Audio nicht verfügbar */ }
    }

    toggleBtn.addEventListener("click", () => (running ? stop() : start()));
    resetBtn.addEventListener("click", () => { stop(); remaining = total; status.textContent = "Bereit"; render(); });
    tabs.forEach((t) => t.addEventListener("click", () => setMode(t.dataset.mode)));
    document.addEventListener("keydown", (e) => {
      if (e.code === "Space") { e.preventDefault(); running ? stop() : start(); }
    });

    render();
  </script>
</body>
</html>
